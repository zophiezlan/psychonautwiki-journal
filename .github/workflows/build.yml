name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Third-party actions are pinned by commit SHA, not by tag, so a tag rewrite
# upstream cannot silently inject malicious code into our build. The version
# comment after each SHA documents what was pinned for human review and is
# what Dependabot updates.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # Verifies gradle/wrapper/gradle-wrapper.jar against the known-good Gradle
    # wrapper checksums. Without this, a tampered wrapper jar would execute
    # arbitrary code on every CI run.
    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

    - name: Install Nix
      uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28 # v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Setup build environment
      run: nix develop --command echo "Development environment ready"

    - name: Build application
      run: |
        cd psychonautwiki-journal-desktop
        nix develop -c -- gradle build

    - name: Run tests
      run: |
        cd psychonautwiki-journal-desktop
        nix develop -c -- gradle test
    # Test failures must fail the build. If you need to skip a flaky test,
    # mark it `@Disabled` with a reason — do not paper over it in CI.

    - name: Verify substance database loading
      run: |
        cd psychonautwiki-journal-desktop
        nix develop -c -- gradle build --info | tee build.log
        grep -E "(substance|Loaded|database)" build.log
