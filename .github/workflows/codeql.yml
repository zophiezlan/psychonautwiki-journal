name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly Monday 06:00 UTC — catches advisories that landed during the week
    # even if no PR was opened.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3.5.0

    - name: Install Nix
      uses: cachix/install-nix-action@6004951b182f8860210c8d6f0d808ec5b1a33d28 # v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    # CodeQL treats Kotlin and Java as a single extractor (java-kotlin); both
    # languages get analysed in one pass.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@53e96ec3b35fce51c141c0d6f0e31028a448722d # v3
      with:
        languages: java-kotlin
        queries: security-and-quality

    # CodeQL's autobuild can't drive a Nix-managed Gradle build; run gradle
    # manually inside the dev shell so the extractor sees the compiled output.
    - name: Build for analysis
      run: |
        cd psychonautwiki-journal-desktop
        nix develop -c -- gradle compileKotlinDesktop --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@53e96ec3b35fce51c141c0d6f0e31028a448722d # v3
      with:
        category: "/language:java-kotlin"
